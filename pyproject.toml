[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtf-to-json"
version = "0.1.0"
description = "Convert RTF files to structured JSON for Rogue Trader campaigns"
requires-python = ">=3.13"
dependencies = [
    "striprtf>=0.0.29",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "pytest>=7.0"
]

[project.scripts]
rtf-to-json = "rtf_to_json.__main__:main"

[tool.setuptools.packages.find]
include = ["rtf_to_json*"]
exclude = ["tests*", "rtf*", "json*"]
